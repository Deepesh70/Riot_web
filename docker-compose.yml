services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7-alpine
    container_name: riotweb-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-riot_reimagined}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: riotweb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend Express API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riotweb-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: "mongodb://mongo:27017/${MONGO_INITDB_DATABASE:-riot_reimagined}"
      REDIS_URL: "redis://redis:6379"
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      JWT_SECRET: ${JWT_SECRET:-riot_super_secret_jwt_key_change_me}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      HENRIK_DEV_API_KEY: ${HENRIK_DEV_API_KEY:-}
      TRUST_PROXY: "1"
    ports:
      - "5000:5000"

  # 4. Frontend Web (Nginx Reverse Proxy & Static Host)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riotweb-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongodata:
  redisdata:
